plugins {
    id 'com.android.application'
}

android {
    namespace 'local.cleanyourtv.radio'
    compileSdk 34

    defaultConfig {
        applicationId 'local.cleanyourtv.radio'
        minSdk 26
        // 28, not 34: from 29 on Android ignores an app's request to re-join Wi-Fi (RadioService.retry).
        targetSdk 28
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            // R8 drops the parts of ExoPlayer a radio stream never touches (video, DRM, most containers).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
    lint {
        // Sideloaded, never on Google Play: its minimum targetSdk does not apply, and 28 is deliberate (above).
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The system MediaPlayer on this stick refuses AAC+ streams; ExoPlayer plays them and MP3 alike.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
}
